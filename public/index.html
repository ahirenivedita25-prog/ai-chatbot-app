<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08c9c6" />
    <link rel="icon" type="image/svg+xml" href="/chatbot-mark.svg" />
    <title>moonlit | AI support</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section id="auth-panel" class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-card">
        <img class="auth-logo" src="/chatbot-mark.svg" alt="" />
        <p class="eyebrow">Moonlit private assistant</p>
        <h1 id="auth-title">Sign in to Moonlit.</h1>
        <p class="auth-copy">
          Your chatbot workspace is available to registered users only.
        </p>
        <form id="auth-form" class="auth-form">
          <label for="auth-email">Email</label>
          <input id="auth-email" type="email" autocomplete="email" required />
          <label for="auth-password">Password</label>
          <input
            id="auth-password"
            type="password"
            minlength="8"
            autocomplete="current-password"
            required
          />
          <button id="auth-submit" type="submit">
            <span>Sign in</span><strong>↗</strong>
          </button>
          <p id="auth-error" class="auth-error" role="alert"></p>
        </form>
        <button id="auth-mode" class="text-button" type="button">
          Create a new account
        </button>
      </div>
    </section>
    <main class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Main navigation">
        <a class="brand" href="/" aria-label="Moonlit home">
          <img class="brand-logo" src="/chatbot-mark.svg" alt="" />
          <span>moonlit</span>
        </a>
        <button id="new-chat" class="nav-action primary-action" type="button">
          <span class="icon" aria-hidden="true">+</span><span>New chat</span>
          <kbd>Ctrl K</kbd>
        </button>
        <button id="invite-button" class="nav-action" type="button">
          <span class="icon" aria-hidden="true">↗</span><span>Invite</span>
        </button>
        <div class="history-heading">
          <span>Chat history</span><span id="history-count">0</span>
        </div>
        <nav
          id="chat-history"
          class="chat-history"
          aria-label="Chat history"
        ></nav>
        <div class="sidebar-footer">
          <div class="admin-profile">
            <span class="profile-avatar" aria-hidden="true">M</span>
            <span class="profile-copy"
              ><strong>Moonlit</strong><small>Admin workspace</small></span
            >
            <span class="profile-menu" aria-hidden="true">···</span>
          </div>
        </div>
      </aside>

      <section class="workspace" aria-label="Moonlit chat workspace">
        <header class="topbar">
          <button
            id="mobile-menu"
            class="icon-button mobile-menu"
            type="button"
            aria-label="Open navigation"
          >
            ☰
          </button>
          <div class="conversation-heading">
            <h1 id="conversation-title">New conversation</h1>
            <p>
              <span class="online-dot"></span>Moonlit · One shared assistant
            </p>
          </div>
          <div class="topbar-actions">
            <label class="industry-picker" for="industry-select">
              <span>Desk</span>
              <select id="industry-select">
                <option value="school">School</option>
                <option value="clinic">Clinic</option>
                <option value="retail">Retail</option>
                <option value="restaurant">Restaurant</option>
              </select>
            </label>
            <button id="logout-button" class="logout-button" type="button">
              Sign out
            </button>
          </div>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>
        <section
          id="starter-prompts"
          class="starter-prompts"
          aria-label="Suggested questions"
        >
          <p class="prompt-heading">What can I help with?</p>
          <div id="prompt-list" class="prompt-list"></div>
        </section>

        <div
          id="attachment-tray"
          class="attachment-tray"
          aria-live="polite"
        ></div>
        <form id="chat-form" class="composer">
          <input
            id="attachment-input"
            type="file"
            hidden
            multiple
            accept="image/png,image/jpeg,image/webp,text/plain,text/markdown,text/csv,application/json"
          />
          <button
            id="attach-button"
            class="composer-tool"
            type="button"
            aria-label="Attach files"
            title="Attach images or text files"
          >
            ＋
          </button>
          <label class="sr-only" for="message-input">Your message</label>
          <textarea
            id="message-input"
            name="message"
            rows="1"
            maxlength="4000"
            placeholder="Message Moonlit..."
          ></textarea>
          <button
            id="voice-input"
            class="composer-tool voice-button"
            type="button"
            aria-label="Start voice input"
            aria-pressed="false"
            title="Dictate message"
          >
            <span aria-hidden="true">◉</span>
          </button>
          <button
            id="send-button"
            class="send-button"
            type="submit"
            aria-label="Send message"
          >
            <span>Send</span><strong>↗</strong>
          </button>
        </form>
        <div class="composer-footer">
          <p
            id="chat-status"
            class="composer-note"
            role="status"
            aria-live="polite"
          >
            AI assistant · Attached files are sent to the configured model
          </p>
          <label class="speech-toggle" for="read-aloud"
            ><input id="read-aloud" type="checkbox" /> Read aloud</label
          >
        </div>
      </section>
      <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
